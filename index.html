<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4338CA">
  <meta name="description" content="WaHeN waa suuq dijitaal ah oo laga helo alaabooyin iyo dukaamo kala duwan.">
  <title>WaHeN Marketplace</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="phone">
    <div class="statusbar" aria-label="Xogta telefoonka">
      <span>9:41</span>
      <span aria-hidden="true">📶 🔋</span>
    </div>

    <header class="topbar">
      <button class="icon-btn" type="button" aria-label="Fur menu-ga">☰</button>
      <a class="brand" href="index.html" aria-label="WaHeN bogga hore">WaHeN</a>
      <button class="icon-btn cart-button" type="button" aria-label="Fur gaadhiga wax iibsiga">🛒</button>
    </header>

    <form class="search" role="search">
      <label for="product-search" class="visually-hidden">Raadi alaab</label>
      <span aria-hidden="true">🔍</span>
      <input id="product-search" type="search" placeholder="Search products..." autocomplete="off">
    </form>

    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-content">
        <div class="hero-copy">
          <div class="hero-eyebrow">SUMMER SALE</div>
          <h1 id="hero-title" class="hero-title">Up to 30% OFF</h1>
          <p class="hero-sub">on all items</p>
          <button class="hero-cta" type="button">Shop Now</button>
        </div>
        <div class="hero-figure" aria-hidden="true">🧑🏾‍💼</div>
      </div>
    </section>

    <section class="section" aria-labelledby="categories-title">
      <div class="section-head">
        <h2 id="categories-title">Categories</h2>
      </div>
      <div class="cat-grid">
        <button class="cat category" type="button" data-category="ragga"><span class="cat-icon" aria-hidden="true">👔</span><span>Men</span></button>
        <button class="cat category" type="button" data-category="haween"><span class="cat-icon" aria-hidden="true">👗</span><span>Women</span></button>
        <button class="cat category" type="button" data-category="caruur"><span class="cat-icon" aria-hidden="true">🍼</span><span>Kids</span></button>
        <button class="cat category" type="button" data-category="beauty"><span class="cat-icon" aria-hidden="true">🧴</span><span>Beauty</span></button>
        <button class="cat category" type="button" data-category="cunto"><span class="cat-icon" aria-hidden="true">🍽️</span><span>Food</span></button>
        <button class="cat category" type="button" data-category="electronics"><span class="cat-icon" aria-hidden="true">🔌</span><span>Electronics</span></button>
      </div>
    </section>

    <section class="section" aria-labelledby="popular-title">
      <div class="section-head">
        <h2 id="popular-title">Best Selling</h2>
        <a href="#products">See all</a>
      </div>
    </section>

    <main id="products" class="prod-grid" aria-label="Alaabooyinka la heli karo">
      <article class="prod-card" data-category="ragga"><div class="prod-image jacket" aria-hidden="true">🧥</div><div class="prod-body"><h3>Men's Drift</h3><div class="prod-price">$135.00</div><div class="prod-rating">★ 4.5</div></div></article>
      <article class="prod-card" data-category="haween"><div class="prod-image blazer" aria-hidden="true">👚</div><div class="prod-body"><h3>Women's Dress</h3><div class="prod-price">$145.00</div><div class="prod-rating">★ 4.8</div></div></article>
      <article class="prod-card" data-category="ragga"><div class="prod-image shoes" aria-hidden="true">👟</div><div class="prod-body"><h3>Boots</h3><div class="prod-price">$200.00</div><div class="prod-rating">★ 4.6</div></div></article>
    </main>

    <nav class="bottom-nav" aria-label="Navigation-ka hoose">
      <button class="nav-item active" type="button"><span class="n-icon" aria-hidden="true">🏠</span><span>Home</span></button>
      <button class="nav-item" type="button"><span class="n-icon" aria-hidden="true">▦</span><span>Categories</span></button>
      <button class="nav-item" type="button"><span class="n-icon" aria-hidden="true">🛒</span><span>Cart</span></button>
      <button class="nav-item" type="button"><span class="n-icon" aria-hidden="true">📦</span><span>Orders</span></button>
      <button class="nav-item" type="button"><span class="n-icon" aria-hidden="true">👤</span><span>Account</span></button>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
