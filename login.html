<!doctype html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaHeN — Gelitaan</title>
  <link rel="stylesheet" href="roles.css">
</head>
<body>
  <main class="auth-card">
    <a class="logo" href="index.html">WaHeN</a>
    <h1>Dooro meesha aad galeyso</h1>
    <p class="muted">Qof walba wuxuu geli doonaa qaybtiisa gaarka ah.</p>
    <form id="role-login" class="form-card">
      <label>Email<input id="email" type="email" required placeholder="email@example.com"></label>
      <label>Password<input id="password" type="password" required placeholder="••••••••"></label>
      <label>Doorkaaga
        <select id="role">
          <option value="buyer">Buyer — Macmiil</option>
          <option value="seller">Seller — Iibiye</option>
          <option value="admin">Admin — Maamule</option>
        </select>
      </label>
      <button class="primary" type="submit">Gali dashboard-ka</button>
    </form>
    <p class="notice">Tani waa demo gelitaan. Production-ka ku xiro Supabase Auth oo role-ka ku xaqiiji database/RLS.</p>
  </main>
  <script src="roles.js"></script>
</body>
</html>
