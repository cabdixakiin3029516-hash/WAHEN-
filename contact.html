<!doctype html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaHeN — Contact</title>
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <main class="page-card narrow">
    <header class="page-nav"><a class="logo" href="index.html">WaHeN</a><a href="home.html">Home</a></header>
    <span class="eyebrow">LA XIRIIR WAHEN</span>
    <h1>Contact Us</h1>
    <p class="muted">Fariintaada noo soo dir, kooxdeennu way kula soo xiriiri doontaa.</p>
    <div class="contact-cards"><a href="mailto:support@wahen.example">📧 support@wahen.example</a><a href="tel:+252630000000">📞 +252 63 000 0000</a><span>📍 Hargeysa, Soomaaliya</span></div>
    <form id="contact-form" class="form-grid">
      <label>Magaca<input required placeholder="Magacaaga"></label>
      <label>Email<input required type="email" placeholder="email@example.com"></label>
      <label>Fariinta<textarea required rows="5" placeholder="Sideen kuu caawin karnaa?"></textarea></label>
      <button class="button" type="submit">Dir fariinta</button>
    </form>
    <p id="contact-message" class="message" role="status"></p>
  </main>
  <script>
    document.getElementById('contact-form').addEventListener('submit', event => {
      event.preventDefault();
      event.currentTarget.reset();
      document.getElementById('contact-message').textContent = 'Fariinta waa la diray. Mahadsanid!';
    });
  </script>
</body>
</html>
